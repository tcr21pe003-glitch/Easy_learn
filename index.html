          headers: { "apikey": SUPABASE_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (data.error) throw new Error(data.error.message || data.msg || "Login failed");
        return data;
      },
      async req(path, options = {}, token) {
        const res = await fetch(`${SUPABASE_URL}/rest/v1${path}`, {
          ...options,
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": `Bearer ${token || SUPABASE_KEY}`,
            "Content-Type": "application/json",
            "Prefer": "return=representation",
            ...options.headers,
          },
        });
        const text = await res.text();
        return text ? JSON.parse(text) : null;
      },
    };

    // ── FSRS Algorithm (Free Spaced Repetition Scheduler) ──────────────────────
    // Based on the open-source FSRS v4 by Jarrett Ye
    // Paper: https://github.com/open-spaced-repetition/fsrs4anki

    const FSRS_W = [
      0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01,
      1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61
    ];
    const FSRS_DECAY = -0.5;
    const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1; // ~0.228
    const TARGET_RETENTION = 0.9; // 90% retention target

    // Convert AI rating to FSRS grade (1=Again, 2=Hard, 3=Good/Easy)
    const FSRS_GRADE = { again: 1, hard: 2, easy: 3 };

    function fsrsRetrievability(stability, daysSinceReview) {
      // R(t) = (1 + FACTOR * t/S) ^ DECAY
      // Probability student remembers the card after t days
      return Math.pow(1 + FSRS_FACTOR * daysSinceReview / stability, FSRS_DECAY);
    }

    function fsrsInitStability(grade) {
      // Initial stability after first review — based on FSRS weights
      return Math.max(FSRS_W[grade - 1], 0.1);
    }

    function fsrsInitDifficulty(grade) {
      // Initial difficulty — hard cards start more difficult
      return Math.min(Math.max(FSRS_W[4] - FSRS_W[5] * (grade - 3), 1), 10);
    }

    function fsrsNextDifficulty(d, grade) {
      // Difficulty adjusts slightly after each review
      const deltaD = -FSRS_W[6] * (grade - 3);
      const meanReversion = FSRS_W[7] * (fsrsInitDifficulty(3) - d);
      return Math.min(Math.max(d + deltaD + meanReversion, 1), 10);
    }

    function fsrsNextStability(d, s, r, grade) {
      if (grade === 1) {
        // Forgot — stability drops significantly
        return FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - r));
      }
      // Remembered — stability grows
      const hardPenalty = grade === 2 ? FSRS_W[15] : 1;
      const easyBonus = grade === 3 ? FSRS_W[16] : 1;
      return s * Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - r)) - 1) * hardPenalty * easyBonus + s;
    }

    function fsrsNextInterval(stability) {
      // Days until retrievability drops to TARGET_RETENTION (90%)
      const interval = (stability / FSRS_FACTOR) * (Math.pow(TARGET_RETENTION, 1 / FSRS_DECAY) - 1);
      return Math.max(Math.round(interval), 1);
    }

    function fsrsUpdate(card, ratingStr) {
      const grade = FSRS_GRADE[ratingStr];
      const now = new Date();

      // First time seeing this card
      if (!card.stability) {
        const S = fsrsInitStability(grade);
        const D = fsrsInitDifficulty(grade);
        const interval = grade === 1 ? 1 : fsrsNextInterval(S);
        const due = new Date();
        due.setDate(due.getDate() + interval);
        return {
          stability: S,
          difficulty: D,
          retrievability: 1.0,
          interval,
          due: due.toISOString(),
        };
      }

      // Card has been seen before — calculate days since last review
      const lastReview = card.last_review ? new Date(card.last_review) : now;
      const daysSince = Math.max((now - lastReview) / 86400000, 0);
      const R = fsrsRetrievability(card.stability, daysSince);
      const newD = fsrsNextDifficulty(card.difficulty, grade);
      const newS = grade === 1
        ? Math.max(fsrsNextStability(newD, card.stability, R, grade), 0.1)
        : Math.max(fsrsNextStability(newD, card.stability, R, grade), card.stability);
      const interval = grade === 1 ? 1 : fsrsNextInterval(newS);
      const due = new Date();
      due.setDate(due.getDate() + interval);

      return {
        stability: parseFloat(newS.toFixed(4)),
        difficulty: parseFloat(newD.toFixed(4)),
        retrievability: parseFloat(R.toFixed(4)),
        interval,
        due: due.toISOString(),
      };
    }

    function Toast({ msg, type }) {
      if (!msg) return null;
      return (
        <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: type === "error" ? C.red : C.green, color: "white", padding: "12px 24px", borderRadius: 10, fontSize: 14, fontWeight: 600, zIndex: 9999, boxShadow: "0 4px 20px rgba(0,0,0,0.2)", whiteSpace: "nowrap" }}>
          {msg}
        </div>
      );
    }

    function LoginScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      const [role, setRole] = useState("student");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      function showToast(msg, type = "error") {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      }

      async function handleSubmit() {
        if (!email || !password || (mode === "signup" && !name)) { showToast("Please fill all fields"); return; }
        setLoading(true);
        try {
          if (mode === "signup") {
            await sb.signUp(email, password, name, role);
            showToast("Account created! Please log in.", "success");
            setMode("login");
          } else {
            const data = await sb.signIn(email, password);
            if (!data.access_token) throw new Error("Login failed");
            const userRole = data.user?.user_metadata?.role || "student";
            const userName = data.user?.user_metadata?.name || email;
            onLogin({ token: data.access_token, role: userRole, name: userName, id: data.user.id, email });
          }
        } catch (e) { showToast(e.message); }
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: C.navy, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          {toast && <Toast msg={toast.msg} type={toast.type} />}
          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 4, color: C.gold, marginBottom: 8 }}>EASY LEARN</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: C.white, lineHeight: 1.2 }}>Smart Study,<br />Better Results.</div>
          </div>
          <div style={{ background: C.white, borderRadius: 20, padding: 28, width: "100%", maxWidth: 380, boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display: "flex", background: C.bg, borderRadius: 10, padding: 4, marginBottom: 24 }}>
              {["login", "signup"].map(m => (
                <button key={m} onClick={() => setMode(m)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: mode === m ? C.navy : "transparent", color: mode === m ? C.white : C.muted, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  {m === "login" ? "Log In" : "Sign Up"}
                </button>
              ))}
            </div>
            {mode === "signup" && (
              <>
                <label style={S.label}>Full Name</label>
                <input style={S.input} placeholder="e.g. Arjun Nair" value={name} onChange={e => setName(e.target.value)} />
                <label style={S.label}>I am a</label>
                <div style={{ display: "flex", gap: 10, marginBottom: 16 }}>
                  {["student", "teacher"].map(r => (
                    <button key={r} onClick={() => setRole(r)} style={{ flex: 1, padding: "10px 0", borderRadius: 8, border: `2px solid ${role === r ? C.navy : C.border}`, background: role === r ? C.navy : "white", color: role === r ? "white" : C.muted, fontWeight: 600, fontSize: 14, cursor: "pointer" }}>
                      {r === "teacher" ? "👨‍🏫 Teacher" : "📚 Student"}
                    </button>
                  ))}
                </div>
              </>
            )}
            <label style={S.label}>Email</label>
            <input style={S.input} type="email" placeholder="you@email.com" value={email} onChange={e => setEmail(e.target.value)} />
            <label style={S.label}>Password</label>
            <input style={S.input} type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            <button onClick={handleSubmit} disabled={loading} style={{ width: "100%", padding: "14px 0", background: loading ? C.muted : C.navy, color: "white", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer", marginTop: 8 }}>
              {loading ? "Please wait..." : mode === "login" ? "Log In →" : "Create Account →"}
            </button>
          </div>
          <div style={{ color: "rgba(255,255,255,0.3)", fontSize: 12, marginTop: 24 }}>Easy Learn · Kerala's Smartest Study App</div>
        </div>
      );

    function TeacherDashboard({ user, onLogout }) {
      const [view, setView] = useState("home");
      const [decks, setDecks] = useState([]);
      const [students, setStudents] = useState([]);
      const [assignments, setAssignments] = useState([]);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(false);
      const [deckName, setDeckName] = useState("");
      const [subject, setSubject] = useState("");
      const [csvText, setCsvText] = useState("");
      const [parsedCards, setParsedCards] = useState([]);
      const [selectedDeck, setSelectedDeck] = useState(null);
      const [selectedStudent, setSelectedStudent] = useState(null);

      function showToast(msg, type = "success") { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); }

      useEffect(() => { loadData(); }, []);

      async function loadData() {
        try {
          const [d, s, a] = await Promise.all([
            sb.req(`/decks?teacher_id=eq.${user.id}&order=created_at.desc`, {}, user.token),
            sb.req(`/profiles?role=eq.student&order=name.asc`, {}, user.token),
            sb.req(`/assignments?teacher_id=eq.${user.id}&order=assigned_at.desc`, {}, user.token),
          ]);
          setDecks(d || []); setStudents(s || []); setAssignments(a || []);
        } catch (e) {}
      }

      function parseCSV(text) {
        const lines = text.trim().split("\n").filter(l => l.trim());
        return lines.map((line, i) => {
          const tab = line.indexOf("\t");
          if (tab > -1) return { id: i, question: line.slice(0, tab).trim(), answer: line.slice(tab + 1).trim() };
          const comma = line.indexOf(",");
          if (comma > -1) return { id: i, question: line.slice(0, comma).trim(), answer: line.slice(comma + 1).trim() };
          return null;
        }).filter(c => c && c.question && c.answer);
      }

      function handleCSVInput(text) { setCsvText(text); setParsedCards(parseCSV(text)); }

      async function uploadDeck() {
        if (!deckName || !subject || parsedCards.length === 0) { showToast("Fill all fields and paste CSV", "error"); return; }
        setLoading(true);
        try {
          await sb.req("/decks", { method: "POST", body: JSON.stringify({ name: deckName, subject, teacher_id: user.id, card_count: parsedCards.length, cards: parsedCards }) }, user.token);
          showToast(`Deck uploaded with ${parsedCards.length} cards`);
          setDeckName(""); setSubject(""); setCsvText(""); setParsedCards([]);
          loadData(); setView("home");
        } catch (e) { showToast("Upload failed: " + e.message, "error"); }
        setLoading(false);
      }

      async function assignDeck() {
        if (!selectedDeck || !selectedStudent) { showToast("Select a deck and student", "error"); return; }
        setLoading(true);
        try {
          await sb.req("/assignments", { method: "POST", body: JSON.stringify({ deck_id: selectedDeck.id, student_id: selectedStudent.id, teacher_id: user.id, deck_name: selectedDeck.name, student_name: selectedStudent.name, status: "assigned", cards: selectedDeck.cards }) }, user.token);
          showToast(`Deck assigned to ${selectedStudent.name}`);
          setSelectedDeck(null); setSelectedStudent(null);
          loadData(); setView("home");
        } catch (e) { showToast("Assign failed: " + e.message, "error"); }
        setLoading(false);
      }

      const COLORS = ["#1B2B5E","#059669","#DC2626","#7C3AED","#D97706","#0891B2"];

      return (
        <div style={{ minHeight: "100vh", background: C.bg }}>
          {toast && <Toast msg={toast.msg} type={toast.type} />}
          <div style={{ background: C.navy, padding: "16px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <div>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 3, color: C.gold }}>EASY LEARN</div>
              <div style={{ fontSize: 16, fontWeight: 700, color: "white" }}>Teacher Dashboard</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
              <div style={{ fontSize: 12, color: "rgba(255,255,255,0.6)" }}>{user.name}</div>
              <button onClick={onLogout} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "white", borderRadius: 8, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>Logout</button>
            </div>
          </div>

          <div style={{ background: "white", borderBottom: `1px solid ${C.border}`, display: "flex", overflowX: "auto" }}>
            {[["home","🏠 Home"],["upload","⬆️ Upload"],["assign","📋 Assign"],["students","👥 Students"]].map(([v,label]) => (
              <button key={v} onClick={() => setView(v)} style={{ padding: "14px 18px", border: "none", background: "none", color: view === v ? C.navy : C.muted, fontWeight: view === v ? 700 : 500, fontSize: 13, cursor: "pointer", borderBottom: view === v ? `3px solid ${C.navy}` : "3px solid transparent", whiteSpace: "nowrap" }}>{label}</button>
            ))}
          </div>

          <div style={{ padding: "20px", maxWidth: 700, margin: "0 auto" }}>
            {view === "home" && (
              <>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 12, marginBottom: 24 }}>
                  {[{label:"Decks",value:decks.length,icon:"📚"},{label:"Students",value:students.length,icon:"👥"},{label:"Assigned",value:assignments.length,icon:"📋"}].map(s => (
                    <div key={s.label} style={{ background: "white", borderRadius: 12, padding: "16px 8px", textAlign: "center", boxShadow: "0 1px 3px rgba(0,0,0,0.06)" }}>
                      <div style={{ fontSize: 20 }}>{s.icon}</div>
                      <div style={{ fontSize: 22, fontWeight: 800, color: C.navy }}>{s.value}</div>
                      <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>{s.label}</div>
                    </div>
                  ))}
                </div>
                <div style={S.sectionTitle}>Recent Assignments</div>
                {assignments.length === 0 ? <div style={S.empty}>No assignments yet.</div> : assignments.slice(0,5).map((a,i) => (
                  <div key={i} style={{ ...S.listItem, marginBottom: 8, borderRadius: 10, background: "white" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontWeight: 700, fontSize: 14, color: C.text }}>{a.deck_name}</div>
                      <div style={{ fontSize: 12, color: C.muted }}>→ {a.student_name}</div>
                    </div>
                    <div style={{ padding: "4px 10px", borderRadius: 20, fontSize: 12, fontWeight: 600, background: a.status === "completed" ? "#d1fae5" : "#fef3c7", color: a.status === "completed" ? C.green : C.amber, marginRight: 8 }}>
                      {a.status === "completed" ? "✅ Done" : "⏳ Pending"}
                    </div>
                    <button onClick={async () => {
                      if (!window.confirm(`Delete assignment "${a.deck_name}" for ${a.student_name}?`)) return;
                      try {
                        await sb.req(`/assignments?id=eq.${a.id}`, { method: "DELETE" }, user.token);
                        showToast("Assignment deleted");
                        loadData();
                      } catch(e) { showToast("Delete failed", "error"); }
                    }} style={{ background: "#fee2e2", border: "none", color: C.red, borderRadius: 8, padding: "6px 10px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                      🗑
                    </button>
                  </div>
                ))}
              </>
            )}

            {view === "upload" && (
              <>
                <div style={S.sectionTitle}>Upload Deck from Anki</div>
                <div style={S.card}>
                  <label style={S.label}>Deck Name</label>
                  <input style={S.input} placeholder="e.g. Cell Biology Chapter 3" value={deckName} onChange={e => setDeckName(e.target.value)} />
                  <label style={S.label}>Subject</label>
                  <input style={S.input} placeholder="e.g. Biology" value={subject} onChange={e => setSubject(e.target.value)} />
                  <label style={S.label}>Paste Anki Export (tab or comma separated)</label>
                  <div style={{ fontSize: 12, color: C.muted, marginBottom: 8 }}>In Anki: File → Export → Notes in Plain Text → paste here</div>
                  <textarea style={{ ...S.input, minHeight: 120, resize: "vertical", fontFamily: "monospace", fontSize: 12 }}
                    placeholder={"Question\tAnswer\nWhat is mitochondria?\tPowerhouse of the cell"}
                    value={csvText} onChange={e => handleCSVInput(e.target.value)} />
                  {parsedCards.length > 0 && (
                    <div style={{ background: "#d1fae5", borderRadius: 8, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: C.green, fontWeight: 600 }}>
                      ✅ {parsedCards.length} cards detected
                    </div>
                  )}
                  <button onClick={uploadDeck} disabled={loading} style={{ ...S.primaryBtn, opacity: loading ? 0.6 : 1 }}>
                    {loading ? "Uploading..." : `Upload ${parsedCards.length > 0 ? parsedCards.length + " Cards" : "Deck"}`}
                  </button>
                </div>
              </>
            )}

            {view === "assign" && (
              <>
                <div style={S.sectionTitle}>Assign Deck to Student</div>
                <div style={S.card}>
                  <label style={S.label}>Select Deck</label>
                  {decks.length === 0 ? <div style={S.empty}>Upload a deck first.</div> : decks.map((d,i) => (
                    <div key={d.id} onClick={() => setSelectedDeck(d)} style={{ display: "flex", alignItems: "center", border: `2px solid ${selectedDeck?.id === d.id ? C.navy : C.border}`, borderRadius: 10, padding: "12px 14px", marginBottom: 8, cursor: "pointer" }}>
                      <div style={{ width: 10, height: 10, borderRadius: "50%", background: COLORS[i % COLORS.length], marginRight: 12 }} />
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{d.name}</div>
                        <div style={{ fontSize: 12, color: C.muted }}>{d.subject} · {d.card_count} cards</div>
                      </div>
                      {selectedDeck?.id === d.id && <div style={{ color: C.navy, fontWeight: 700 }}>✓</div>}
                    </div>
                  ))}
                  <label style={{ ...S.label, marginTop: 16 }}>Select Student</label>
                  {students.length === 0 ? <div style={S.empty}>No students signed up yet.</div> : students.map(s => (
                    <div key={s.id} onClick={() => setSelectedStudent(s)} style={{ display: "flex", alignItems: "center", border: `2px solid ${selectedStudent?.id === s.id ? C.navy : C.border}`, borderRadius: 10, padding: "12px 14px", marginBottom: 8, cursor: "pointer" }}>
                      <div style={{ width: 32, height: 32, borderRadius: "50%", background: C.navy, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 700, fontSize: 13, marginRight: 12 }}>
                        {s.name?.[0]?.toUpperCase() || "S"}
                      </div>
                      <div style={{ flex: 1 }}>
                        <div style={{ fontWeight: 700, fontSize: 14 }}>{s.name}</div>
                        <div style={{ fontSize: 12, color: C.muted }}>{s.email}</div>
                      </div>
                      {selectedStudent?.id === s.id && <div style={{ color: C.navy, fontWeight: 700 }}>✓</div>}
                    </div>
                  ))}
                  <button onClick={assignDeck} disabled={loading || !selectedDeck || !selectedStudent} style={{ ...S.primaryBtn, opacity: (!selectedDeck || !selectedStudent || loading) ? 0.5 : 1, marginTop: 16 }}>
                    {loading ? "Assigning..." : "Assign Deck →"}
                  </button>
                </div>
              </>
            )}

            {view === "students" && (
              <>
                <div style={S.sectionTitle}>All Students</div>
                {students.length === 0 ? <div style={S.empty}>No students yet. Share the app link so they can sign up.</div> : students.map(s => {
                  const sa = assignments.filter(a => a.student_id === s.id);
                  const done = sa.filter(a => a.status === "completed").length;
                  return (
                    <div key={s.id} style={{ ...S.card, marginBottom: 12 }}>
                      <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                        <div style={{ width: 40, height: 40, borderRadius: "50%", background: C.navy, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 16 }}>
                          {s.name?.[0]?.toUpperCase() || "S"}
                        </div>
                        <div>
                          <div style={{ fontWeight: 700, fontSize: 15, color: C.text }}>{s.name}</div>
                          <div style={{ fontSize: 12, color: C.muted }}>{s.email}</div>
                        </div>
                      </div>
                      <div style={{ display: "flex", gap: 10, marginTop: 12 }}>
                        <div style={{ flex: 1, background: C.bg, borderRadius: 8, padding: "8px 6px", textAlign: "center", fontSize: 12, color: C.muted }}><span style={{ fontWeight: 800, color: C.navy }}>{sa.length}</span> assigned</div>
                        <div style={{ flex: 1, background: C.bg, borderRadius: 8, padding: "8px 6px", textAlign: "center", fontSize: 12, color: C.muted }}><span style={{ fontWeight: 800, color: C.green }}>{done}</span> done</div>
                        <div style={{ flex: 1, background: C.bg, borderRadius: 8, padding: "8px 6px", textAlign: "center", fontSize: 12, color: C.muted }}><span style={{ fontWeight: 800, color: C.amber }}>{sa.length - done}</span> pending</div>
                      </div>
                    </div>
                  );
                })}
              </>
            )}
          </div>
        </div>
      );
    }

    function StudySession({ deck, onFinish, user, streak = 0 }) {
      const [queue, setQueue] = useState([]);
      const [cardIndex, setCardIndex] = useState(0);
      const [phase, setPhase] = useState("question");
      const [answer, setAnswer] = useState("");
      const [evaluation, setEvaluation] = useState(null);
      const [stats, setStats] = useState({ easy: 0, hard: 0, again: 0 });
      const [totalAnswered, setTotalAnswered] = useState(0);
      const [finished, setFinished] = useState(false);
      const [listening, setListening] = useState(false);
      const [cardProgress, setCardProgress] = useState({});
      const [sessionStartTime] = useState(Date.now());
      const [loadingCards, setLoadingCards] = useState(true);
      const textareaRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => { if (phase === "typing" && textareaRef.current) textareaRef.current.focus(); }, [phase]);

      useEffect(() => {
        async function loadAll() {
          setLoadingCards(true);
          try {
            // Always fetch fresh cards from deck table
            let cards = deck.cards || [];
            if (cards.length === 0) {
              const deckData = await sb.req(`/decks?id=eq.${deck.id}`, {}, user.token);
              if (deckData && deckData[0]) cards = deckData[0].cards || [];
            }
            // Load FSRS progress
            const progressData = await sb.req(`/card_progress?student_id=eq.${user.id}&deck_id=eq.${deck.id}`, {}, user.token);
            const map = {};
            if (progressData) progressData.forEach(p => { map[p.card_id] = p; });
            setCardProgress(map);
            // Filter due cards
            const now = new Date();
            const due = cards.filter(c => {
              const cp = map[c.id];
              if (!cp) return true;
              return new Date(cp.due_date) <= now;
            });
            setQueue(due.length > 0 ? due : cards);
          } catch(e) {
            setQueue(deck.cards || []);
          }
          setLoadingCards(false);
        }
        loadAll();
      }, []);

      function startVoice() {
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) { alert("Voice not supported on this browser. Use Chrome."); return; }
        const recognition = new SpeechRecognition();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognitionRef.current = recognition;
        recognition.onstart = () => setListening(true);
        recognition.onend = () => setListening(false);
        recognition.onresult = (e) => {
          const transcript = e.results[0][0].transcript;
          setAnswer(prev => prev ? prev + " " + transcript : transcript);
        };
        recognition.start();
      }

      function stopVoice() {
        if (recognitionRef.current) { recognitionRef.current.stop(); }
        setListening(false);
      }

      if (loadingCards) return (
        <div style={{ minHeight: "100vh", background: C.navy, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ width: 40, height: 40, border: "3px solid rgba(255,255,255,0.2)", borderTop: "3px solid " + C.gold, borderRadius: "50%", animation: "spin 0.8s linear infinite", marginBottom: 16 }} />
          <div style={{ color: "rgba(255,255,255,0.7)", fontSize: 15 }}>Loading cards...</div>
        </div>
      );

      if (queue.length === 0) return (
        <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>📭</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.text }}>No cards found</div>
          <div style={{ fontSize: 14, color: C.muted, marginTop: 8, marginBottom: 20 }}>Ask your teacher to check this deck.</div>
          <button onClick={() => onFinish("back")} style={{ ...S.primaryBtn, width: "auto", padding: "12px 24px" }}>Go Back</button>
        </div>
      );

      const card = queue[cardIndex];
      const progress = (cardIndex / queue.length) * 100;
      const RC = { easy: C.green, hard: C.amber, again: C.red };
      const RL = { easy: "✅ Easy", hard: "⚠️ Hard", again: "🔁 Again" };

      async function evaluateAnswer() {
        if (!answer.trim()) return;
        setPhase("evaluating");
        const prompt = `You are an expert teacher. Evaluate the student's answer.
Question: "${card.question}"
Model Answer: "${card.answer}"
Student's Answer: "${answer}"
Respond ONLY in JSON (no markdown): {"rating":"easy"|"hard"|"again","score":0-100,"feedback":"2-3 sentences","missed":"key concept missed or null"}
easy=75-100, hard=40-74, again=0-39`;
        try {
          const res = await fetch("https://api.anthropic.com/v1/messages", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ model: "claude-sonnet-4-6", max_tokens: 1000, messages: [{ role: "user", content: prompt }] }),
          });
          const data = await res.json();
          const text = data.content.map(i => i.text || "").join("");
          const parsed = JSON.parse(text.replace(/```json|```/g, "").trim());
          setEvaluation(parsed); setPhase("result");
        } catch {
          setEvaluation({ rating: "hard", score: 50, feedback: "Could not evaluate. Review your answer carefully.", missed: null });
          setPhase("result");
        }
      }

      async function handleRating(r) {
        setStats(s => ({ ...s, [r]: s[r] + 1 }));
        setTotalAnswered(t => t + 1);
        // Save FSRS progress to Supabase
        const prev = cardProgress[card.id] || {};
        const updated = fsrsUpdate(prev, r);
        try {
          await sb.req("/card_progress", {
            method: "POST",
            headers: { "Prefer": "resolution=merge-duplicates,return=representation" },
            body: JSON.stringify({
              student_id: user.id,
              deck_id: deck.id,
              card_id: card.id,
              stability: updated.stability,
              difficulty: updated.difficulty,
              retrievability: updated.retrievability,
              interval: updated.interval,
              due_date: updated.due,
              last_review: new Date().toISOString(),
              updated_at: new Date().toISOString()
            })
          }, user.token);
        } catch(e) {}

        if (r === "again") {
          // Add card back to end of queue — keep repeating until correct
          const newQueue = [...queue];
          newQueue.push({ ...card, isRepeat: true });
          setQueue(newQueue);
        }

        const nextIndex = cardIndex + 1;
        // Only finish when we've gone through entire queue including repeats
        if (nextIndex >= queue.length && r !== "again") {
          setFinished(true);
        } else if (nextIndex >= queue.length) {
          // Card was added back, move to it
          setCardIndex(nextIndex);
          setAnswer(""); setEvaluation(null); setPhase("question");
        } else {
          setCardIndex(nextIndex);
          setAnswer(""); setEvaluation(null); setPhase("question");
        }
      }

      if (finished) {
        const mins = Math.round((Date.now() - sessionStartTime) / 60000);
        const accuracy = totalAnswered > 0 ? Math.round((stats.easy + stats.hard) / totalAnswered * 100) : 0;
        const newStreak = streak + 1;
        return (
          <div style={{ minHeight: "100vh", background: C.navy, display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}>
            <div style={{ background: "white", borderRadius: 24, padding: "32px 24px", maxWidth: 380, width: "100%", boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
              <div style={{ textAlign: "center", marginBottom: 24 }}>
                <div style={{ fontSize: 52, marginBottom: 8 }}>🎉</div>
                <div style={{ fontSize: 22, fontWeight: 800, color: C.text }}>Session Complete!</div>
                <div style={{ fontSize: 14, color: C.muted, marginTop: 4 }}>{deck.name}</div>
              </div>

              {/* Main stats */}
              <div style={{ background: C.bg, borderRadius: 16, padding: 16, marginBottom: 16 }}>
                <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 12 }}>TODAY'S SESSION</div>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                  <div style={{ background: "white", borderRadius: 12, padding: "12px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 26, fontWeight: 800, color: C.navy }}>{initialCards.length}</div>
                    <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Cards Reviewed</div>
                  </div>
                  <div style={{ background: "white", borderRadius: 12, padding: "12px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 26, fontWeight: 800, color: C.green }}>{accuracy}%</div>
                    <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Accuracy</div>
                  </div>
                  <div style={{ background: "white", borderRadius: 12, padding: "12px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 26, fontWeight: 800, color: C.amber }}>{mins} min</div>
                    <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Time Spent</div>
                  </div>
                  <div style={{ background: "white", borderRadius: 12, padding: "12px 10px", textAlign: "center" }}>
                    <div style={{ fontSize: 26, fontWeight: 800, color: C.gold }}>🔥 {streak}</div>
                    <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Day Streak</div>
                  </div>
                </div>
              </div>

              {/* Card breakdown */}
              <div style={{ display: "flex", gap: 8, marginBottom: 20 }}>
                {[["easy", "✅ Mastered", C.green], ["hard", "⚠️ Review", C.amber], ["again", "🔁 Repeated", C.red]].map(([k, label, color]) => (
                  <div key={k} style={{ flex: 1, background: color + "15", borderRadius: 10, padding: "10px 6px", textAlign: "center" }}>
                    <div style={{ fontSize: 20, fontWeight: 800, color }}>{stats[k]}</div>
                    <div style={{ fontSize: 10, color: C.muted, fontWeight: 600 }}>{label}</div>
                  </div>
                ))}
              </div>

              {stats.again > 0 && (
                <div style={{ background: "#fef3c7", border: "1px solid #fde68a", borderRadius: 10, padding: "10px 14px", marginBottom: 16, fontSize: 13, color: "#92400e" }}>
                  💪 You repeated {stats.again} hard card{stats.again > 1 ? "s" : ""} until you got {stats.again > 1 ? "them" : "it"} right. That's real learning.
                </div>
              )}

              <button onClick={() => onFinish("complete")} style={S.primaryBtn}>Complete & Save →</button>
            </div>
          </div>
        );
      }

      return (
        <div style={{ minHeight: "100vh", background: C.bg }}>
          <div style={{ background: C.navy, padding: "14px 20px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
            <button onClick={() => onFinish("back")} style={{ background: "none", border: "none", color: C.gold, fontSize: 14, fontWeight: 600, cursor: "pointer" }}>← Back</button>
            <div style={{ color: "white", fontWeight: 700, fontSize: 14 }}>{deck.name}</div>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              {streak > 0 && <div style={{ display: "flex", alignItems: "center", gap: 3, background: "rgba(255,255,255,0.12)", borderRadius: 20, padding: "3px 10px" }}><span>🔥</span><span style={{ fontSize: 13, fontWeight: 800, color: C.gold }}>{streak}</span></div>}
              <div style={{ color: "rgba(255,255,255,0.6)", fontSize: 13 }}>{cardIndex + 1}/{cards.length}</div>
            </div>
          </div>
          <div style={{ height: 4, background: "#e2e8f0" }}>
            <div style={{ height: "100%", background: deck.color || C.navy, width: `${progress}%`, transition: "width 0.4s" }} />
          </div>
          {card && card.isRepeat && (
            <div style={{ background: "#fef3c7", padding: "6px 20px", fontSize: 12, fontWeight: 600, color: "#92400e", textAlign: "center" }}>
              🔁 Repeating — answer correctly to move on
            </div>
          )}
          <div style={{ padding: "20px", maxWidth: 600, margin: "0 auto" }}>
            <div style={{ background: "white", borderRadius: 14, padding: 20, marginBottom: 16, borderLeft: `4px solid ${deck.color || C.navy}`, boxShadow: "0 1px 4px rgba(0,0,0,0.06)" }}>
              <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 10 }}>QUESTION</div>
              <div style={{ fontSize: 17, fontWeight: 600, color: C.text, lineHeight: 1.5 }}>{card.question}</div>
            </div>
            {phase === "question" && (
              <div style={{ display: "flex", gap: 10 }}>
                <button onClick={() => setPhase("typing")} style={{ ...S.primaryBtn, flex: 1 }}>✏️ Type Answer</button>
                <button onClick={() => { setPhase("typing"); setTimeout(startVoice, 300); }} style={{ ...S.primaryBtn, flex: 1, background: C.green }}>🎤 Voice Answer</button>
              </div>
            )}
            {phase === "typing" && (
              <div>
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                  <div style={{ fontSize: 12, fontWeight: 600, color: C.muted }}>Your Answer</div>
                  <button onClick={listening ? stopVoice : startVoice} style={{ display: "flex", alignItems: "center", gap: 6, background: listening ? C.red : C.green, color: "white", border: "none", borderRadius: 20, padding: "6px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                    {listening ? "⏹ Stop" : "🎤 Speak"}
                  </button>
                </div>
                {listening && (
                  <div style={{ background: "#fef2f2", border: "1.5px solid #fca5a5", borderRadius: 10, padding: "10px 14px", marginBottom: 10, fontSize: 13, color: C.red, fontWeight: 600 }}>
                    🔴 Listening... speak your answer
                  </div>
                )}
                <textarea ref={textareaRef} style={{ ...S.input, minHeight: 120, resize: "vertical" }} value={answer} onChange={e => setAnswer(e.target.value)} placeholder="Speak or type your answer here..." />
                <button onClick={evaluateAnswer} disabled={!answer.trim()} style={{ ...S.primaryBtn, opacity: answer.trim() ? 1 : 0.5 }}>Submit Answer →</button>
              </div>
            )}
            {phase === "evaluating" && (
              <div style={{ background: "white", borderRadius: 14, padding: 32, textAlign: "center" }}>
                <div style={{ width: 32, height: 32, border: `3px solid ${C.border}`, borderTop: `3px solid ${C.navy}`, borderRadius: "50%", animation: "spin 0.8s linear infinite", margin: "0 auto 12px" }} />
                <div style={{ color: C.muted, fontSize: 14 }}>Evaluating your answer...</div>
              </div>
            )}
            {phase === "result" && evaluation && (
              <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
                <div style={{ background: "white", borderRadius: 14, padding: "14px 18px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                  <div style={{ background: RC[evaluation.rating] + "20", color: RC[evaluation.rating], border: `1.5px solid ${RC[evaluation.rating]}`, padding: "6px 14px", borderRadius: 20, fontSize: 13, fontWeight: 700 }}>{RL[evaluation.rating]}</div>
                  <div style={{ fontSize: 26, fontWeight: 800, color: C.text }}>{evaluation.score}<span style={{ fontSize: 13, color: C.muted }}>/100</span></div>
                </div>
                <div style={{ background: "white", borderRadius: 14, padding: 16 }}>
                  <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 8 }}>FEEDBACK</div>
                  <div style={{ fontSize: 14, color: "#334155", lineHeight: 1.6 }}>{evaluation.feedback}</div>
                  {evaluation.missed && <div style={{ marginTop: 10, background: "#fefce8", border: "1px solid #fde68a", borderRadius: 8, padding: "8px 12px", fontSize: 13, color: "#92400e" }}>💡 Missed: <strong>{evaluation.missed}</strong></div>}
                </div>
                <details style={{ background: "#f8fafc", border: `1px solid ${C.border}`, borderRadius: 10, padding: "12px 16px" }}>
                  <summary style={{ fontSize: 13, fontWeight: 600, color: C.navy, cursor: "pointer" }}>See model answer</summary>
                  <div style={{ marginTop: 10, fontSize: 14, color: "#334155", lineHeight: 1.6 }}>{card.answer}</div>
                </details>
                <button onClick={() => handleRating(evaluation.rating)} style={{ ...S.primaryBtn, background: RC[evaluation.rating] }}>
                  Next Question →
                </button>
              </div>
            )}
          </div>
        </div>
      );
    }

    function StudentApp({ user, onLogout }) {
      const [assignments, setAssignments] = useState([]);
      const [activeStudy, setActiveStudy] = useState(null);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(true);
      const [streak, setStreak] = useState(0);
      const [longestStreak, setLongestStreak] = useState(0);
      const COLORS = ["#1B2B5E","#059669","#DC2626","#7C3AED","#D97706","#0891B2"];

      function showToast(msg, type = "success") { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); }

      useEffect(() => { loadAssignments(); loadStreak(); }, []);

      async function loadStreak() {
        try {
          const data = await sb.req(`/streaks?student_id=eq.${user.id}`, {}, user.token);
          if (data && data.length > 0) {
            setStreak(data[0].current_streak || 0);
            setLongestStreak(data[0].longest_streak || 0);
          }
        } catch(e) {}
      }

      async function updateStreak() {
        const today = new Date().toISOString().split("T")[0];
        try {
          const data = await sb.req(`/streaks?student_id=eq.${user.id}`, {}, user.token);
          if (data && data.length > 0) {
            const s = data[0];
            const last = s.last_study_date;
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().split("T")[0];
            let newStreak = s.current_streak || 0;
            if (last === today) return; // already studied today
            if (last === yesterdayStr) newStreak += 1; // continued streak
            else newStreak = 1; // streak broken, restart
            const newLongest = Math.max(newStreak, s.longest_streak || 0);
            await sb.req(`/streaks?student_id=eq.${user.id}`, {
              method: "PATCH",
              body: JSON.stringify({ current_streak: newStreak, longest_streak: newLongest, last_study_date: today, updated_at: new Date().toISOString() })
            }, user.token);
            setStreak(newStreak);
            setLongestStreak(newLongest);
            if (newStreak > 1) showToast(`🔥 ${newStreak} day streak! Keep it up!`, "success");
          } else {
            await sb.req("/streaks", {
              method: "POST",
              body: JSON.stringify({ student_id: user.id, current_streak: 1, longest_streak: 1, last_study_date: today })
            }, user.token);
            setStreak(1);
            setLongestStreak(1);
          }
        } catch(e) {}
      }

      async function loadAssignments() {
        setLoading(true);
        try {
          const [data, progress] = await Promise.all([
            sb.req(`/assignments?student_id=eq.${user.id}&order=assigned_at.desc`, {}, user.token),
            sb.req(`/card_progress?student_id=eq.${user.id}`, {}, user.token),
          ]);
          const assignments = data || [];
          const progressMap = {};
          (progress || []).forEach(p => {
            if (!progressMap[p.deck_id]) progressMap[p.deck_id] = {};
            progressMap[p.deck_id][p.card_id] = p;
          });
          // Add due card count to each assignment
          const now = new Date();
          const withDue = assignments.map(a => {
            const cards = a.cards || [];
            const deckProgress = progressMap[a.deck_id] || {};
            const dueCards = cards.filter(c => {
              const cp = deckProgress[c.id];
              if (!cp) return true; // never studied = due
              return new Date(cp.due_date) <= now;
            });
            return { ...a, dueCount: dueCards.length, dueCards };
          });
          setAssignments(withDue);
        } catch (e) {}
        setLoading(false);
      }

      async function markComplete(assignmentId) {
        try {
          await sb.req(`/assignments?id=eq.${assignmentId}`, { method: "PATCH", body: JSON.stringify({ status: "completed", completed_at: new Date().toISOString() }) }, user.token);
          showToast("Deck completed! Your teacher will assign the next one.");
          loadAssignments();
        } catch (e) { showToast("Error saving progress", "error"); }
      }

      if (activeStudy) {
        const currentStudy = activeStudy;
        return <StudySession deck={currentStudy.deck} user={user} streak={streak} onFinish={(action) => {
          setActiveStudy(null);
          if (action === "complete") { updateStreak(); markComplete(currentStudy.id); }
          else if (action === "streak") { updateStreak(); }
        }} />;
      }

      const pending = assignments.filter(a => a.status !== "completed");
      const done = assignments.filter(a => a.status === "completed");

      return (
        <div style={{ minHeight: "100vh", background: C.bg }}>
          {toast && <Toast msg={toast.msg} type={toast.type} />}
          <div style={{ background: C.navy, padding: "16px 20px" }}>
            <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 3, color: C.gold }}>EASY LEARN</div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 4 }}>
              <div style={{ fontSize: 16, fontWeight: 700, color: "white" }}>Hi, {user.name.split(" ")[0]} 👋</div>
              <button onClick={onLogout} style={{ background: "rgba(255,255,255,0.15)", border: "none", color: "white", borderRadius: 8, padding: "6px 12px", fontSize: 12, cursor: "pointer" }}>Logout</button>
            </div>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 8 }}>
              <div style={{ fontSize: 13, color: "rgba(255,255,255,0.6)" }}>{pending.length} deck{pending.length !== 1 ? "s" : ""} to study</div>
              <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                <div style={{ display: "flex", alignItems: "center", gap: 4, background: "rgba(255,255,255,0.12)", borderRadius: 20, padding: "4px 12px" }}>
                  <span style={{ fontSize: 16 }}>🔥</span>
                  <span style={{ fontSize: 14, fontWeight: 800, color: C.gold }}>{streak}</span>
                  <span style={{ fontSize: 11, color: "rgba(255,255,255,0.6)" }}>day streak</span>
                </div>
              </div>
            </div>
          </div>
          <div style={{ padding: "20px", maxWidth: 600, margin: "0 auto" }}>
            {loading ? (
              <div style={{ textAlign: "center", padding: 40, color: C.muted }}>Loading your decks...</div>
            ) : (
              <>
                {pending.length > 0 && (
                  <>
                    <div style={S.sectionTitle}>Study Now</div>
                    {pending.map((a, i) => (
                      <div key={a.id} style={{ background: "white", borderRadius: 14, marginBottom: 14, overflow: "hidden", boxShadow: "0 2px 8px rgba(0,0,0,0.07)" }}>
                        <div style={{ height: 5, background: COLORS[i % COLORS.length] }} />
                        <div style={{ padding: "16px 18px", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div>
                            <div style={{ fontWeight: 700, fontSize: 16, color: C.text }}>{a.deck_name}</div>
                            <div style={{ fontSize: 12, color: C.muted, marginTop: 3 }}>{a.dueCount > 0 ? `${a.dueCount} cards due today` : "No cards due · check back tomorrow"}</div>
                          </div>
                          <button onClick={async () => {
                              // Always fetch fresh cards from decks table to avoid blank screen
                              let cards = a.dueCards && a.dueCards.length > 0 ? a.dueCards : a.cards || [];
                              if (cards.length === 0) {
                                try {
                                  const deckData = await sb.req(`/decks?id=eq.${a.deck_id}`, {}, user.token);
                                  if (deckData && deckData[0]) cards = deckData[0].cards || [];
                                } catch(e) {}
                              }
                              setActiveStudy({ id: a.id, deck: { id: a.deck_id, name: a.deck_name, color: COLORS[i % COLORS.length], cards: cards } });
                            }}
                            style={{ background: a.dueCount === 0 ? C.muted : COLORS[i % COLORS.length], color: "white", border: "none", borderRadius: 10, padding: "10px 18px", fontWeight: 700, fontSize: 13, cursor: a.dueCount === 0 ? "not-allowed" : "pointer" }}
                            disabled={a.dueCount === 0}>
                            {a.dueCount === 0 ? "All done ✓" : `Study ${a.dueCount} cards →`}
                          </button>
                        </div>
                      </div>
                    ))}
                  </>
                )}
                {pending.length === 0 && (
                  <div style={{ textAlign: "center", padding: "60px 20px" }}>
                    <div style={{ fontSize: 48, marginBottom: 12 }}>🎉</div>
                    <div style={{ fontSize: 18, fontWeight: 700, color: C.text }}>All caught up!</div>
                    <div style={{ fontSize: 14, color: C.muted, marginTop: 8 }}>Your teacher will assign new decks soon.</div>
                  </div>
                )}
                {done.length > 0 && (
                  <>
                    <div style={{ ...S.sectionTitle, marginTop: 24 }}>Completed</div>
                    {done.map(a => (
                      <div key={a.id} style={{ ...S.listItem, background: "white", borderRadius: 10, marginBottom: 8 }}>
                        <div style={{ flex: 1, fontWeight: 600, fontSize: 14, color: C.muted, textDecoration: "line-through" }}>{a.deck_name}</div>
                        <div style={{ padding: "4px 10px", borderRadius: 20, fontSize: 12, fontWeight: 600, background: "#d1fae5", color: C.green }}>✅ Done</div>
                      </div>
                    ))}
                  </>
                )}
              </>
            )}
          </div>
        </div>
      );
    }

    function App() {
      const [user, setUser] = useState(null);
      if (!user) return <LoginScreen onLogin={setUser} />;
      if (user.role === "teacher") return <TeacherDashboard user={user} onLogout={() => setUser(null)} />;
      return <StudentApp user={user} onLogout={() => setUser(null)} />;
    }

    const S = {
      label: { fontSize: 12, fontWeight: 600, color: C.muted, display: "block", marginBottom: 6 },
      input: { width: "100%", border: `1.5px solid ${C.border}`, borderRadius: 10, padding: "11px 14px", fontSize: 14, color: C.text, outline: "none", fontFamily: "inherit", background: "white", marginBottom: 14 },
      primaryBtn: { width: "100%", padding: "13px 0", background: C.navy, color: "white", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: "pointer" },
      card: { background: "white", borderRadius: 14, padding: "20px 18px", boxShadow: "0 1px 4px rgba(0,0,0,0.06)", marginBottom: 16 },
      sectionTitle: { fontSize: 11, fontWeight: 700, letterSpacing: 2, color: C.muted, textTransform: "uppercase", marginBottom: 12 },
      listItem: { display: "flex", alignItems: "center", padding: "12px 14px", gap: 10 },
      empty: { color: C.muted, fontSize: 14, padding: "20px 0", textAlign: "center" },
    };

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
