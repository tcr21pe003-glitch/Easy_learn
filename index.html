    // ── FSRS Algorithm (Free Spaced Repetition Scheduler) ──────────────────────
    // Based on the open-source FSRS v4 by Jarrett Ye
    // Paper: https://github.com/open-spaced-repetition/fsrs4anki

    const FSRS_W = [
      0.4, 0.6, 2.4, 5.8, 4.93, 0.94, 0.86, 0.01,
      1.49, 0.14, 0.94, 2.18, 0.05, 0.34, 1.26, 0.29, 2.61
    ];
    const FSRS_DECAY = -0.5;
    const FSRS_FACTOR = Math.pow(0.9, 1 / FSRS_DECAY) - 1; // ~0.228
    const TARGET_RETENTION = 0.9; // 90% retention target

    // Convert AI rating to FSRS grade (1=Again, 2=Hard, 3=Good/Easy)
    const FSRS_GRADE = { again: 1, hard: 2, easy: 3 };

    function fsrsRetrievability(stability, daysSinceReview) {
      // R(t) = (1 + FACTOR * t/S) ^ DECAY
      // Probability student remembers the card after t days
      return Math.pow(1 + FSRS_FACTOR * daysSinceReview / stability, FSRS_DECAY);
    }

    function fsrsInitStability(grade) {
      // Initial stability after first review — based on FSRS weights
      return Math.max(FSRS_W[grade - 1], 0.1);
    }

    function fsrsInitDifficulty(grade) {
      // Initial difficulty — hard cards start more difficult
      return Math.min(Math.max(FSRS_W[4] - FSRS_W[5] * (grade - 3), 1), 10);
    }

    function fsrsNextDifficulty(d, grade) {
      // Difficulty adjusts slightly after each review
      const deltaD = -FSRS_W[6] * (grade - 3);
      const meanReversion = FSRS_W[7] * (fsrsInitDifficulty(3) - d);
      return Math.min(Math.max(d + deltaD + meanReversion, 1), 10);
    }

    function fsrsNextStability(d, s, r, grade) {
      if (grade === 1) {
        // Forgot — stability drops significantly
        return FSRS_W[11] * Math.pow(d, -FSRS_W[12]) * (Math.pow(s + 1, FSRS_W[13]) - 1) * Math.exp(FSRS_W[14] * (1 - r));
      }
      // Remembered — stability grows
      const hardPenalty = grade === 2 ? FSRS_W[15] : 1;
      const easyBonus = grade === 3 ? FSRS_W[16] : 1;
      return s * Math.exp(FSRS_W[8]) * (11 - d) * Math.pow(s, -FSRS_W[9]) * (Math.exp(FSRS_W[10] * (1 - r)) - 1) * hardPenalty * easyBonus + s;
    }

    function fsrsNextInterval(stability) {
      // Days until retrievability drops to TARGET_RETENTION (90%)
      const interval = (stability / FSRS_FACTOR) * (Math.pow(TARGET_RETENTION, 1 / FSRS_DECAY) - 1);
      return Math.max(Math.round(interval), 1);
    }

    function fsrsUpdate(card, ratingStr) {
      const grade = FSRS_GRADE[ratingStr];
      const now = new Date();

      // First time seeing this card
      if (!card.stability) {
        const S = fsrsInitStability(grade);
        const D = fsrsInitDifficulty(grade);
        const interval = grade === 1 ? 1 : fsrsNextInterval(S);
        const due = new Date();
        due.setDate(due.getDate() + interval);
        return {
          stability: S,
          difficulty: D,
          retrievability: 1.0,
          interval,
          due: due.toISOString(),
        };
      }

      // Card has been seen before — calculate days since last review
      const lastReview = card.last_review ? new Date(card.last_review) : now;
      const daysSince = Math.max((now - lastReview) / 86400000, 0);
      const R = fsrsRetrievability(card.stability, daysSince);
      const newD = fsrsNextDifficulty(card.difficulty, grade);
      const newS = grade === 1
        ? Math.max(fsrsNextStability(newD, card.stability, R, grade), 0.1)
        : Math.max(fsrsNextStability(newD, card.stability, R, grade), card.stability);
      const interval = grade === 1 ? 1 : fsrsNextInterval(newS);
      const due = new Date();
      due.setDate(due.getDate() + interval);

      return {
        stability: parseFloat(newS.toFixed(4)),
        difficulty: parseFloat(newD.toFixed(4)),
        retrievability: parseFloat(R.toFixed(4)),
        interval,
        due: due.toISOString(),
      };
    }

    function Toast({ msg, type }) {
      if (!msg) return null;
      return (
        <div style={{ position: "fixed", top: 20, left: "50%", transform: "translateX(-50%)", background: type === "error" ? C.red : C.green, color: "white", padding: "12px 24px", borderRadius: 10, fontSize: 14, fontWeight: 600, zIndex: 9999, boxShadow: "0 4px 20px rgba(0,0,0,0.2)", whiteSpace: "nowrap" }}>
          {msg}
        </div>
      );
    }

    function LoginScreen({ onLogin }) {
      const [mode, setMode] = useState("login");
      const [role, setRole] = useState("student");
      const [email, setEmail] = useState("");
      const [password, setPassword] = useState("");
      const [name, setName] = useState("");
      const [loading, setLoading] = useState(false);
      const [toast, setToast] = useState(null);

      function showToast(msg, type = "error") {
        setToast({ msg, type });
        setTimeout(() => setToast(null), 3500);
      }

      async function handleSubmit() {
        if (!email || !password || (mode === "signup" && !name)) { showToast("Please fill all fields"); return; }
        setLoading(true);
        try {
          if (mode === "signup") {
            await sb.signUp(email, password, name, "student");
            showToast("Account created! Please log in.", "success");
            setMode("login");
          } else {
            const data = await sb.signIn(email, password);
            if (!data.access_token) throw new Error("Login failed");
            const userRole = data.user?.user_metadata?.role || "student";
            const userName = data.user?.user_metadata?.name || email;
            onLogin({ token: data.access_token, role: userRole, name: userName, id: data.user.id, email });
          }
        } catch (e) { showToast(e.message); }
        setLoading(false);
      }

      return (
        <div style={{ minHeight: "100vh", background: C.navy, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          {toast && <Toast msg={toast.msg} type={toast.type} />}
          <div style={{ textAlign: "center", marginBottom: 36 }}>
            <div style={{ fontSize: 12, fontWeight: 700, letterSpacing: 4, color: C.gold, marginBottom: 8 }}>EASY LEARN</div>
            <div style={{ fontSize: 28, fontWeight: 800, color: C.white, lineHeight: 1.2 }}>Smart Study,<br />Better Results.</div>
          </div>
          <div style={{ background: C.white, borderRadius: 20, padding: 28, width: "100%", maxWidth: 380, boxShadow: "0 20px 60px rgba(0,0,0,0.3)" }}>
            <div style={{ display: "flex", background: C.bg, borderRadius: 10, padding: 4, marginBottom: 24 }}>
              {["login", "signup"].map(m => (
                <button key={m} onClick={() => setMode(m)} style={{ flex: 1, padding: "8px 0", borderRadius: 8, border: "none", background: mode === m ? C.navy : "transparent", color: mode === m ? C.white : C.muted, fontWeight: 700, fontSize: 14, cursor: "pointer" }}>
                  {m === "login" ? "Log In" : "Sign Up"}
                </button>
              ))}
            </div>

              <>
                <label style={S.label}>Full Name</label>
                <input style={S.input} placeholder="e.g. Arjun Nair" value={name} onChange={e => setName(e.target.value)} />
              </>
            )}
            <label style={S.label}>Email</label>
            <input style={S.input} type="email" placeholder="you@email.com" value={email} onChange={e => setEmail(e.target.value)} />
            <label style={S.label}>Password</label>
            <input style={S.input} type="password" placeholder="••••••••" value={password} onChange={e => setPassword(e.target.value)} onKeyDown={e => e.key === "Enter" && handleSubmit()} />
            <button onClick={handleSubmit} disabled={loading} style={{ width: "100%", padding: "14px 0", background: loading ? C.muted : C.navy, color: "white", border: "none", borderRadius: 10, fontSize: 15, fontWeight: 700, cursor: loading ? "not-allowed" : "pointer", marginTop: 8 }}>

      );

    function StudentProfiles({ students, assignments, summaries, user }) {
      const [selectedStudent, setSelectedStudent] = React.useState(null);

      if (selectedStudent) {
        const sa = assignments.filter(a => a.student_id === selectedStudent.id);
        const done = sa.filter(a => a.status === "completed");
        const pending = sa.filter(a => a.status !== "completed");
        const studentSummaries = summaries.filter(s => s.student_id === selectedStudent.id);

        // Retention score — average score across all sessions
        const retentionScore = studentSummaries.length > 0
          ? Math.round(studentSummaries.reduce((sum, s) => sum + (s.avg_score || 0), 0) / studentSummaries.length)
          : 0;

        // Study habit score
        const completedThisWeek = studentSummaries.filter(s => {
          const d = new Date(s.completed_at);
          const now = new Date();
          return (now - d) < 7 * 24 * 60 * 60 * 1000;
        }).length;
        const habitScore = Math.min(100, Math.round(completedThisWeek * 14));

        // Weak subjects
        const subjectScores = {};
        studentSummaries.forEach(s => {
          if (!subjectScores[s.subject]) subjectScores[s.subject] = [];
          subjectScores[s.subject].push(s.avg_score || 0);
        });
        const subjectAvgs = Object.entries(subjectScores).map(([sub, scores]) => ({
          subject: sub,
          avg: Math.round(scores.reduce((a, b) => a + b, 0) / scores.length)
        })).sort((a, b) => a.avg - b.avg);

        // Hardest cards across all sessions
        const hardestCards = studentSummaries
          .flatMap(s => s.hardest_cards || [])
          .sort((a, b) => a.score - b.score)
          .slice(0, 5);

        // Next review dates from summaries
        const upcomingReviews = studentSummaries
          .filter(s => s.next_review_date)
          .sort((a, b) => new Date(a.next_review_date) - new Date(b.next_review_date))
          .slice(0, 3);

        // Effort score
        const effortScore = Math.min(100, Math.round((retentionScore * 0.4) + (habitScore * 0.4) + (done.length / Math.max(sa.length, 1) * 100 * 0.2)));

        function exportReport() {
          const lines = [
            "EASY LEARN - STUDENT REPORT",
            "============================",
            "Student: " + selectedStudent.name,
            "Date: " + new Date().toLocaleDateString(),
            "",
            "OVERVIEW",
            "Decks Assigned: " + sa.length,
            "Decks Completed: " + done.length,
            "Decks Pending: " + pending.length,
            "",
            "KEY SCORES",
            "Retention Score: " + retentionScore + "/100",
            "Study Habit Score: " + habitScore + "/100",
            "Overall Effort Score: " + effortScore + "/100",
            "",
            "SUBJECT PERFORMANCE",
            ...subjectAvgs.map(function(s) { return s.subject + ": " + s.avg + "%"; }),
            "",
            "WEAK AREAS",
            ...(hardestCards.length > 0 ? hardestCards.map(function(c) { return "- " + c.question + " (Score: " + c.score + "/10)"; }) : ["No weak areas yet"]),
            "",
            "UPCOMING REVIEWS",
            ...(upcomingReviews.length > 0 ? upcomingReviews.map(function(s) { return s.deck_name + ": " + new Date(s.next_review_date).toLocaleDateString(); }) : ["None scheduled"]),
            "",
            "Generated by Easy Learn"
          ];
          const report = lines.join("\n");
          const blob = new Blob([report], { type: "text/plain" });
          const url = URL.createObjectURL(blob);
          const a2 = document.createElement("a");
          a2.href = url;
          a2.download = selectedStudent.name + "_report.txt";
          a2.click();
          URL.revokeObjectURL(url);
        }

        return (
          <div>
            <button onClick={() => setSelectedStudent(null)} style={{ background: "none", border: "none", color: C.navy, fontSize: 14, fontWeight: 700, cursor: "pointer", marginBottom: 16, padding: 0 }}>← All Students</button>

            {/* Header */}
            <div style={{ background: C.navy, borderRadius: 16, padding: 20, marginBottom: 16, color: "white" }}>
              <div style={{ display: "flex", alignItems: "center", gap: 14, marginBottom: 16 }}>
                <div style={{ width: 52, height: 52, borderRadius: "50%", background: C.gold, color: C.navy, display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 22 }}>
                  {selectedStudent.name?.[0]?.toUpperCase()}
                </div>
                <div>
                  <div style={{ fontSize: 18, fontWeight: 800 }}>{selectedStudent.name}</div>
                  <div style={{ fontSize: 12, opacity: 0.6 }}>{selectedStudent.email}</div>
                </div>
              </div>

              {/* 3 key scores */}
              <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 10 }}>
                {[
                  { label: "Retention", value: retentionScore, unit: "/100", color: C.green },
                  { label: "Habit", value: habitScore, unit: "/100", color: C.gold },
                  { label: "Effort", value: effortScore, unit: "/100", color: "#a78bfa" },
                ].map(item => (
                  <div key={item.label} style={{ background: "rgba(255,255,255,0.1)", borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
                    <div style={{ fontSize: 22, fontWeight: 800, color: item.color }}>{item.value}</div>
                    <div style={{ fontSize: 10, opacity: 0.7, fontWeight: 600 }}>{item.label}</div>
                  </div>
                ))}
              </div>
            </div>

            {/* Deck progress */}
            <div style={S.card}>
              <div style={S.sectionTitle}>Deck Progress</div>
              <div style={{ display: "flex", gap: 10, marginBottom: 12 }}>
                <div style={{ flex: 1, background: "#d1fae5", borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.green }}>{done.length}</div>
                  <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Completed</div>
                </div>
                <div style={{ flex: 1, background: "#fef3c7", borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.amber }}>{pending.length}</div>
                  <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Pending</div>
                </div>
                <div style={{ flex: 1, background: "#eff6ff", borderRadius: 10, padding: "10px 8px", textAlign: "center" }}>
                  <div style={{ fontSize: 22, fontWeight: 800, color: C.navy }}>{sa.length}</div>
                  <div style={{ fontSize: 11, color: C.muted, fontWeight: 600 }}>Total</div>
                </div>
              </div>
              {/* Progress bar */}
              <div style={{ height: 8, background: C.bg, borderRadius: 8, overflow: "hidden" }}>
                <div style={{ height: "100%", width: `${sa.length > 0 ? (done.length / sa.length * 100) : 0}%`, background: C.green, borderRadius: 8 }} />
              </div>
              <div style={{ fontSize: 12, color: C.muted, marginTop: 6 }}>{sa.length > 0 ? Math.round(done.length / sa.length * 100) : 0}% of assigned decks completed</div>
            </div>

            {/* Subject performance */}
            {subjectAvgs.length > 0 && (
              <div style={S.card}>
                <div style={S.sectionTitle}>Subject Performance</div>
                {subjectAvgs.map(s => (
                  <div key={s.subject} style={{ marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 4 }}>
                      <div style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{s.subject}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: s.avg >= 70 ? C.green : s.avg >= 40 ? C.amber : C.red }}>{s.avg}%</div>
                    </div>
                    <div style={{ height: 6, background: C.bg, borderRadius: 6, overflow: "hidden" }}>
                      <div style={{ height: "100%", width: `${s.avg}%`, background: s.avg >= 70 ? C.green : s.avg >= 40 ? C.amber : C.red, borderRadius: 6 }} />
                    </div>
                  </div>
                ))}
                {subjectAvgs.length > 0 && subjectAvgs[0].avg < 50 && (
                  <div style={{ background: "#fee2e2", border: "1px solid #fca5a5", borderRadius: 8, padding: "8px 12px", marginTop: 10, fontSize: 13, color: C.red }}>
                    ⚠️ <strong>{subjectAvgs[0].subject}</strong> needs attention — lowest score
                  </div>
                )}
              </div>
            )}

            {/* Weak cards */}
            {hardestCards.length > 0 && (
              <div style={S.card}>
                <div style={S.sectionTitle}>Hardest Questions</div>
                {hardestCards.map((c, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: i < hardestCards.length - 1 ? `1px solid ${C.border}` : "none" }}>
                    <div style={{ fontSize: 13, color: C.text, flex: 1, paddingRight: 10 }}>{c.question}</div>
                    <div style={{ fontSize: 13, fontWeight: 700, color: C.red }}>{c.score}/10</div>
                  </div>
                ))}
              </div>
            )}

            {/* Upcoming reviews */}
            {upcomingReviews.length > 0 && (
              <div style={S.card}>
                <div style={S.sectionTitle}>Next Review Dates</div>
                {upcomingReviews.map((s, i) => (
                  <div key={i} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "8px 0", borderBottom: i < upcomingReviews.length - 1 ? `1px solid ${C.border}` : "none" }}>
                    <div style={{ fontSize: 13, fontWeight: 600, color: C.text }}>{s.deck_name}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{new Date(s.next_review_date).toLocaleDateString()}</div>
                  </div>
                ))}
              </div>
            )}

            {/* Recent sessions */}
            {studentSummaries.length > 0 && (
              <div style={S.card}>
                <div style={S.sectionTitle}>Recent Sessions</div>
                {studentSummaries.slice(0, 5).map((s, i) => (
                  <div key={i} style={{ padding: "10px 0", borderBottom: i < 4 ? `1px solid ${C.border}` : "none" }}>
                    <div style={{ display: "flex", justifyContent: "space-between" }}>
                      <div style={{ fontWeight: 600, fontSize: 14, color: C.text }}>{s.deck_name}</div>
                      <div style={{ fontSize: 13, fontWeight: 700, color: s.avg_score >= 70 ? C.green : s.avg_score >= 40 ? C.amber : C.red }}>{s.avg_score}%</div>
                    </div>
                    <div style={{ fontSize: 12, color: C.muted, marginTop: 2 }}>
                      {s.duration_minutes} mins · {new Date(s.completed_at).toLocaleDateString()} · ✅{s.easy_count} ⚠️{s.hard_count} 🔁{s.again_count}
                    </div>
                  </div>
                ))}
              </div>
            )}

            {/* Export */}
            <button onClick={exportReport} style={{ ...S.primaryBtn, background: C.green, marginBottom: 24 }}>
              📄 Export Report for Parents
            </button>
          </div>
        );
      }

      // Student list
      return (
        <>
          <div style={S.sectionTitle}>Student Profiles</div>
          {students.length === 0 ? (
            <div style={S.empty}>No students yet. Share the app link so they can sign up.</div>
          ) : students.map(s => {
            const sa = assignments.filter(a => a.student_id === s.id);
            const done = sa.filter(a => a.status === "completed").length;
            const studentSummaries = summaries.filter(sm => sm.student_id === s.id);
            const avgScore = studentSummaries.length > 0
              ? Math.round(studentSummaries.reduce((sum, sm) => sum + (sm.avg_score || 0), 0) / studentSummaries.length)
              : null;
            return (
              <div key={s.id} onClick={() => { setSelectedStudent(s); setView("studentdetail"); }} style={{ ...S.card, marginBottom: 12, cursor: "pointer", borderLeft: `4px solid ${C.navy}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 44, height: 44, borderRadius: "50%", background: C.navy, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, fontSize: 18 }}>
                    {s.name?.[0]?.toUpperCase() || "S"}
                  </div>
                  <div style={{ flex: 1 }}>
                    <div style={{ fontWeight: 700, fontSize: 15, color: C.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{done}/{sa.length} decks completed</div>
                  </div>
                  {avgScore !== null && (
                    <div style={{ background: avgScore >= 70 ? "#d1fae5" : avgScore >= 40 ? "#fef3c7" : "#fee2e2", color: avgScore >= 70 ? C.green : avgScore >= 40 ? C.amber : C.red, borderRadius: 20, padding: "4px 12px", fontSize: 13, fontWeight: 700 }}>
                      {avgScore}%
                    </div>
                  )}
                  <div style={{ color: C.muted, fontSize: 16 }}>›</div>
                </div>
              </div>
            );
          })}
        </>
      );
    }

    function CurriculumBuilder({ user, students = [] }) {
      const [tree, setTree] = React.useState([]);
      const [loading, setLoading] = React.useState(true);
      const [expanded, setExpanded] = React.useState({});
      const [adding, setAdding] = React.useState(null);
      const [newName, setNewName] = React.useState("");
      const [editingCard, setEditingCard] = React.useState(null);
      const [activeStudy, setActiveStudy] = React.useState(null);
      const [assignModal, setAssignModal] = React.useState(null);
      const [toast, setToast] = React.useState("");

      function showToast(msg) { setToast(msg); setTimeout(() => setToast(""), 2500); }

      React.useEffect(() => { loadTree(); }, []);

      async function loadTree() {
        setLoading(true);
        try {
          const data = await sb.req("/curriculum?teacher_id=eq." + user.id + "&order=order_index.asc", {}, user.token);
          setTree(data || []);
        } catch(e) {}
        setLoading(false);
      }

      async function addNode(parentId, type) {
        if (!newName.trim()) return;
        const siblings = tree.filter(n => n.parent_id === (parentId || null));
        try {
          await sb.req("/curriculum", {
            method: "POST",
            body: JSON.stringify({ teacher_id: user.id, name: newName.trim(), type: type || "node", parent_id: parentId || null, cards: [], order_index: siblings.length })
          }, user.token);
          setNewName(""); setAdding(null);
          showToast("Added!");
          loadTree();
        } catch(e) { showToast("Error: " + e.message); }
      }

      async function deleteNode(id) {
        if (!window.confirm("Delete this and all its contents?")) return;
        const allChildren = getAllChildren(id);
        for (const cid of allChildren) {
          await sb.req("/curriculum?id=eq." + cid, { method: "DELETE" }, user.token).catch(() => {});
        }
        await sb.req("/curriculum?id=eq." + id, { method: "DELETE" }, user.token).catch(() => {});
        loadTree();
      }

      function getAllChildren(id) {
        const direct = tree.filter(n => n.parent_id === id).map(n => n.id);
        return [...direct, ...direct.flatMap(cid => getAllChildren(cid))];
      }

      async function saveCard(nodeId, card, isEdit) {
        const node = tree.find(n => n.id === nodeId);
        if (!node) return;
        let cards = [...(node.cards || [])];
        if (isEdit) cards = cards.map(c => c.id === card.id ? card : c);
        else cards.push({ ...card, id: Date.now() });
        try {
          await sb.req("/curriculum?id=eq." + nodeId, { method: "PATCH", body: JSON.stringify({ cards }) }, user.token);
          setEditingCard(null);
          showToast("Question saved!");
          loadTree();
        } catch(e) { showToast("Error saving"); }
      }

      async function deleteCard(nodeId, cardId) {
        const node = tree.find(n => n.id === nodeId);
        if (!node) return;
        const cards = (node.cards || []).filter(c => c.id !== cardId);
        await sb.req("/curriculum?id=eq." + nodeId, { method: "PATCH", body: JSON.stringify({ cards }) }, user.token);
        loadTree();
      }

      function toggle(id) { setExpanded(e => ({ ...e, [id]: !e[id] })); }
      const getChildren = (pid) => tree.filter(n => n.parent_id === (pid || null));
      const getDepth = (id) => {
        let depth = 0;
        let node = tree.find(n => n.id === id);
        while (node && node.parent_id) { depth++; node = tree.find(n => n.id === node.parent_id); }
        return depth;
      };

      const COLORS = [C.navy, C.amber, C.green, "#7C3AED", "#0891B2", "#DC2626"];
      const LABELS = ["Subject", "Chapter", "Sub-topic", "Topic", "Sub-topic 2", "Detail"];

      function CardEditor({ nodeId, card }) {
        const [q, setQ] = React.useState(card ? card.question : "");
        const [a, setA] = React.useState(card ? card.answer : "");
        const [type, setType] = React.useState(card ? (card.type || "text") : "text");
        const [opts, setOpts] = React.useState(card ? (card.options || ["","","",""]) : ["","","",""]);
        const [hintsArr, setHintsArr] = React.useState(card ? (card.hints || [""]) : [""]);

        function save() {
          if (!q.trim() || !a.trim()) return;
          const newCard = { id: card ? card.id : Date.now(), question: q, answer: a, type };
          if (type === "mcq") newCard.options = opts.filter(o => o.trim());
          const validHints = hintsArr.filter(h => h.trim());
          if (validHints.length > 0) newCard.hints = validHints;
          saveCard(nodeId, newCard, !!card);
        }

        const inp = { width: "100%", border: "1.5px solid " + C.border, borderRadius: 8, padding: "8px 12px", fontSize: 13, outline: "none", fontFamily: "inherit", marginBottom: 8, boxSizing: "border-box", background: "white" };

        return (
          <div style={{ background: "#f0fdf4", border: "1.5px solid #bbf7d0", borderRadius: 10, padding: 14, marginTop: 8 }}>
            <div style={{ fontSize: 11, fontWeight: 700, color: C.green, marginBottom: 8 }}>{card ? "✏️ EDIT QUESTION" : "➕ NEW QUESTION"}</div>
            <div style={{ display: "flex", gap: 6, marginBottom: 10 }}>
              {["text","mcq","oneword"].map(t => (
                <button key={t} onClick={() => setType(t)} style={{ flex: 1, padding: "6px 4px", fontSize: 11, fontWeight: 700, border: "1.5px solid " + (type === t ? C.navy : C.border), borderRadius: 6, background: type === t ? C.navy : "white", color: type === t ? "white" : C.muted, cursor: "pointer" }}>
                  {t === "text" ? "📝 Long" : t === "mcq" ? "🔘 MCQ" : "💬 Short"}
                </button>
              ))}
            </div>
            <input style={inp} value={q} onChange={e => setQ(e.target.value)} placeholder="Question" />
            {type === "mcq" ? (
              <>
                {opts.map((o, i) => <input key={i} style={inp} value={o} onChange={e => { const n=[...opts]; n[i]=e.target.value; setOpts(n); }} placeholder={"Option " + String.fromCharCode(65+i)} />)}
                <input style={inp} value={a} onChange={e => setA(e.target.value)} placeholder="Correct answer (must match an option exactly)" />
              </>
            ) : (
              <input style={inp} value={a} onChange={e => setA(e.target.value)} placeholder={type === "oneword" ? "One word answer" : "Full model answer"} />
            )}
            <div style={{ fontSize: 11, fontWeight: 700, color: C.muted, marginBottom: 6, marginTop: 4 }}>💡 HINTS (optional)</div>
            {hintsArr.map((h, i) => (
              <div key={i} style={{ display: "flex", gap: 6, marginBottom: 6 }}>
                <input style={{ ...inp, marginBottom: 0 }} value={h} onChange={e => { const n=[...hintsArr]; n[i]=e.target.value; setHintsArr(n); }} placeholder={"Hint " + (i+1) + " — max score if used: " + [10,8,6,5,4,3,2][Math.min(i+1,6)] + "/10"} />
                {hintsArr.length > 1 && <button onClick={() => setHintsArr(hintsArr.filter((_,j) => j !== i))} style={{ background: "#fee2e2", border: "none", color: C.red, borderRadius: 6, padding: "0 10px", cursor: "pointer" }}>✕</button>}
              </div>
            ))}
            {hintsArr.length < 6 && <button onClick={() => setHintsArr([...hintsArr, ""])} style={{ fontSize: 12, color: C.muted, background: "none", border: "none", cursor: "pointer", marginBottom: 8 }}>+ Add hint level</button>}
            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <button onClick={save} style={{ flex: 2, padding: "9px 0", background: C.green, color: "white", border: "none", borderRadius: 8, fontSize: 13, fontWeight: 700, cursor: "pointer" }}>💾 Save</button>
              <button onClick={() => setEditingCard(null)} style={{ flex: 1, padding: "9px 0", background: C.bg, border: "none", borderRadius: 8, fontSize: 13, cursor: "pointer" }}>Cancel</button>
            </div>
          </div>
        );
      }

      function TreeNode({ node, depth }) {
        const children = getChildren(node.id);
        const cards = node.cards || [];
        const color = COLORS[Math.min(depth, COLORS.length - 1)];
        const isOpen = expanded[node.id];
        const totalCards = cards.length + children.reduce((sum, c) => sum + (c.cards||[]).length, 0);

        return (
          <div style={{ marginTop: 8 }}>
            <div style={{ background: depth === 0 ? "white" : depth === 1 ? C.bg : "#fff", borderRadius: 10, overflow: "hidden", border: depth > 0 ? "1px solid " + C.border : "none", boxShadow: depth === 0 ? "0 1px 4px rgba(0,0,0,0.06)" : "none" }}>
              {/* Node header */}
              <div onClick={() => toggle(node.id)} style={{ display: "flex", alignItems: "center", padding: depth === 0 ? "14px 16px" : depth === 1 ? "10px 14px" : "8px 12px", cursor: "pointer", borderLeft: "4px solid " + color }}>
                <span style={{ fontSize: 12, marginRight: 8, color: C.muted }}>{isOpen ? "▼" : "▶"}</span>
                <span style={{ flex: 1, fontWeight: depth === 0 ? 800 : depth === 1 ? 700 : 600, fontSize: depth === 0 ? 15 : depth === 1 ? 14 : 13, color: depth === 0 ? C.navy : C.text }}>
                  {node.name}
                </span>
                <span style={{ fontSize: 10, color: C.muted, marginRight: 8 }}>
                  {children.length > 0 ? children.length + " sub" : ""}{cards.length > 0 ? (children.length > 0 ? " · " : "") + cards.length + "Q" : ""}
                </span>
                <button onClick={e => { e.stopPropagation(); deleteNode(node.id); }} style={{ background: "#fee2e2", border: "none", color: C.red, borderRadius: 5, padding: "3px 7px", fontSize: 11, cursor: "pointer" }}>🗑</button>
              </div>

              {/* Expanded content */}
              {isOpen && (
                <div style={{ padding: "0 " + (depth === 0 ? 16 : 12) + "px " + (depth === 0 ? 14 : 10) + "px" }}>

                  {/* Child nodes */}
                  {children.map(child => <TreeNode key={child.id} node={child} depth={depth + 1} />)}

                  {/* Add child node button */}
                  {adding && adding.parentId === node.id ? (
                    <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                      <input autoFocus style={{ flex: 1, border: "1.5px solid " + C.border, borderRadius: 8, padding: "8px 12px", fontSize: 13, outline: "none" }}
                        value={newName} onChange={e => setNewName(e.target.value)} placeholder={"Enter name..."}
                        onKeyDown={e => { if (e.key === "Enter") addNode(node.id, "node"); if (e.key === "Escape") { setAdding(null); setNewName(""); } }}
                      />
                      <button onClick={() => addNode(node.id, "node")} style={{ background: C.navy, color: "white", border: "none", borderRadius: 8, padding: "8px 14px", fontSize: 12, fontWeight: 700, cursor: "pointer" }}>Add</button>
                      <button onClick={() => { setAdding(null); setNewName(""); }} style={{ background: C.bg, border: "none", borderRadius: 8, padding: "8px 12px", fontSize: 12, cursor: "pointer" }}>✕</button>
                    </div>
                  ) : (
                    <button onClick={e => { e.stopPropagation(); setAdding({ parentId: node.id }); }} style={{ width: "100%", marginTop: 8, padding: "6px 0", background: "none", border: "1.5px dashed " + C.border, borderRadius: 8, fontSize: 12, color: C.muted, cursor: "pointer" }}>
                      + Add sub-level inside {node.name}
                    </button>
                  )}

                  {/* Questions section */}
                  <div style={{ marginTop: 10, borderTop: "1px solid " + C.border, paddingTop: 10 }}>
                    <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: 2, color: C.muted, marginBottom: 8 }}>QUESTIONS IN THIS TOPIC ({cards.length})</div>

                    {cards.map((card, ci) => (
                      <div key={card.id} style={{ background: "white", borderRadius: 8, padding: "8px 10px", marginBottom: 6, border: "1px solid " + C.border }}>
                        {editingCard && editingCard.nodeId === node.id && editingCard.card && editingCard.card.id === card.id ? (
                          <CardEditor nodeId={node.id} card={card} />
                        ) : (
                          <>
                            <div style={{ display: "flex", alignItems: "center", gap: 6, marginBottom: 4 }}>
                              <span style={{ fontSize: 10, background: card.type === "mcq" ? "#eff6ff" : card.type === "oneword" ? "#f0fdf4" : "#fef3c7", color: card.type === "mcq" ? C.navy : card.type === "oneword" ? C.green : C.amber, borderRadius: 4, padding: "2px 6px", fontWeight: 700 }}>
                                {card.type === "mcq" ? "MCQ" : card.type === "oneword" ? "SHORT" : "LONG"}
                              </span>
                              {card.hints && card.hints.length > 0 && <span style={{ fontSize: 10, color: C.muted }}>💡 {card.hints.length} hints</span>}
                            </div>
                            <div style={{ fontSize: 13, fontWeight: 600, color: C.text, marginBottom: 2 }}>{card.question}</div>
                            <div style={{ fontSize: 12, color: C.muted }}>→ {card.answer.length > 60 ? card.answer.slice(0,60) + "..." : card.answer}</div>
                            <div style={{ display: "flex", gap: 6, marginTop: 6 }}>
                              <button onClick={() => setEditingCard({ nodeId: node.id, card })} style={{ fontSize: 11, background: "#eff6ff", border: "none", color: C.navy, borderRadius: 5, padding: "3px 8px", cursor: "pointer" }}>✏️ Edit</button>
                              <button onClick={() => deleteCard(node.id, card.id)} style={{ fontSize: 11, background: "#fee2e2", border: "none", color: C.red, borderRadius: 5, padding: "3px 8px", cursor: "pointer" }}>🗑 Delete</button>
                            </div>
                          </>
                        )}
                      </div>
                    ))}

                    {editingCard && editingCard.nodeId === node.id && !editingCard.card ? (
                      <CardEditor nodeId={node.id} card={null} />
                    ) : (
                      <button onClick={() => setEditingCard({ nodeId: node.id, card: null })} style={{ width: "100%", padding: "8px 0", background: "none", border: "1.5px dashed " + C.green, borderRadius: 8, fontSize: 12, color: C.green, fontWeight: 700, cursor: "pointer" }}>
                        ➕ Add Question to {node.name}
                      </button>
                    )}

                    {cards.length > 0 && (
                      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                        <button onClick={() => setActiveStudy({ deck: { id: node.id, name: node.name, color, cards }, user })} style={{ flex: 1, padding: "8px 0", background: color, color: "white", border: "none", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                          ▶ Preview ({cards.length} Q)
                        </button>
                        <button onClick={() => setAssignModal({ node, cards })} style={{ flex: 1, padding: "8px 0", background: C.green, color: "white", border: "none", borderRadius: 8, fontSize: 12, fontWeight: 700, cursor: "pointer" }}>
                          📋 Assign to Student
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              )}
            </div>
          </div>
        );
      }

      if (showStudentExit) return (
        <div style={{ minHeight: "100vh", background: C.navy, display: "flex", alignItems: "center", justifyContent: "center", padding: 24, fontFamily: "inherit" }}>
          <div style={{ background: "white", borderRadius: 20, padding: 32, maxWidth: 320, width: "100%", textAlign: "center" }}>
            <div style={{ fontSize: 40, marginBottom: 12 }}>⚙️</div>
            <div style={{ fontSize: 18, fontWeight: 800, color: C.text, marginBottom: 4 }}>{user.name}</div>
            <div style={{ fontSize: 13, color: C.muted, marginBottom: 8 }}>{user.email}</div>
            <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 6, marginBottom: 24 }}>
              <span>🔥</span>
              <span style={{ fontWeight: 800, color: C.gold, fontSize: 18 }}>{streak}</span>
              <span style={{ fontSize: 13, color: C.muted }}>day streak</span>
            </div>
            <div style={{ height: 1, background: C.border, marginBottom: 16 }} />
            <button onClick={() => setShowStudentExit(false)} style={{ ...S.primaryBtn, marginBottom: 10 }}>← Back to Study</button>
            <button onClick={onLogout} style={{ width: "100%", padding: "12px 0", background: "#fee2e2", color: C.red, border: "none", borderRadius: 10, fontSize: 14, fontWeight: 700, cursor: "pointer" }}>🚪 Log Out</button>
          </div>
        </div>
      );

      if (activeStudy) return <StudySession deck={activeStudy.deck} user={user} streak={0} onFinish={() => setActiveStudy(null)} />;

      if (loading) return <div style={{ textAlign: "center", padding: 40, color: C.muted }}>Loading curriculum...</div>;

      // Assign modal
      if (assignModal) {
        return (
          <div style={{ padding: "0 0 80px" }}>
            <button onClick={() => setAssignModal(null)} style={{ background: "none", border: "none", color: C.navy, fontWeight: 700, fontSize: 14, cursor: "pointer", marginBottom: 16, padding: 0 }}>← Back</button>
            <div style={S.card}>
              <div style={{ fontWeight: 800, fontSize: 15, color: C.text, marginBottom: 4 }}>Assign "{assignModal.node.name}"</div>
              <div style={{ fontSize: 12, color: C.muted, marginBottom: 16 }}>{assignModal.cards.length} questions</div>
              <div style={{ fontWeight: 700, fontSize: 13, color: C.text, marginBottom: 10 }}>Select Student:</div>
              {students.length === 0 ? <div style={S.empty}>No students yet.</div> : students.map(s => (
                <button key={s.id} onClick={async () => {
                  try {
                    await sb.req("/assignments", {
                      method: "POST",
                      body: JSON.stringify({ deck_id: assignModal.node.id, student_id: s.id, teacher_id: user.id, deck_name: assignModal.node.name, student_name: s.name, status: "assigned", cards: assignModal.cards })
                    }, user.token);
                    showToast("Assigned to " + s.name + "!");
                    setAssignModal(null);
                  } catch(e) { showToast("Error: " + e.message); }
                }} style={{ width: "100%", display: "flex", alignItems: "center", gap: 12, padding: "12px 14px", background: C.bg, border: "none", borderRadius: 10, marginBottom: 8, cursor: "pointer", textAlign: "left" }}>
                  <div style={{ width: 36, height: 36, borderRadius: "50%", background: C.navy, color: "white", display: "flex", alignItems: "center", justifyContent: "center", fontWeight: 800, flexShrink: 0 }}>
                    {s.name?.[0]?.toUpperCase()}
                  </div>
                  <div>
                    <div style={{ fontWeight: 700, fontSize: 14, color: C.text }}>{s.name}</div>
                    <div style={{ fontSize: 12, color: C.muted }}>{s.email}</div>
                  </div>
                  <div style={{ marginLeft: "auto", fontSize: 18, color: C.green }}>→</div>
                </button>
              ))}
            </div>
          </div>
        );
      }

      const roots = getChildren(null);

      return (
        <div>
          {toast ? <div style={{ background: C.green, color: "white", borderRadius: 8, padding: "10px 14px", marginBottom: 12, fontSize: 13, fontWeight: 600 }}>{toast}</div> : null}
          <div style={S.sectionTitle}>Curriculum Builder</div>
          <div style={{ fontSize: 12, color: C.muted, marginBottom: 16 }}>Build your subject tree. Add questions at any level.</div>

          {roots.length === 0 && !adding && (
            <div style={S.empty}>No curriculum yet. Add your first subject below.</div>
          )}

          {roots.map(node => <TreeNode key={node.id} node={node} depth={0} />)}

          {adding && adding.parentId === null ? (
            <div style={{ display: "flex", gap: 8, marginTop: 12 }}>
              <input autoFocus style={{ flex: 1, border: "1.5px solid " + C.border, borderRadius: 8, padding: "10px 14px", fontSize: 14, outline: "none" }}
                value={newName} onChange={e => setNewName(e.target.value)} placeholder="Subject name (e.g. Biology)"
                onKeyDown={e => { if (e.key === "Enter") addNode(null, "node"); if (e.key === "Escape") { setAdding(null); setNewName(""); } }}
              />
              <button onClick={() => addNode(null, "node")} style={{ background: C.navy, color: "white", border: "none", borderRadius: 8, padding: "10px 16px", fontSize: 13, fontWeight: 700, cursor: "pointer" }}>Add</button>
              <button onClick={() => { setAdding(null); setNewName(""); }} style={{ background: C.bg, border: "none", borderRadius: 8, padding: "10px 12px", fontSize: 13, cursor: "pointer" }}>✕</button>
            </div>
          ) : (
            <button onClick={() => setAdding({ parentId: null })} style={{ width: "100%", marginTop: 12, padding: "10px 0", background: "none", border: "1.5px dashed " + C.border, borderRadius: 10, fontSize: 13, color: C.muted, cursor: "pointer" }}>
              + Add Subject
            </button>
          )}
        </div>
      );
    }

    function StudySession({ deck, onFinish, user, streak = 0 }) {
      const [queue, setQueue] = useState(() => deck.cards || []);
      const [cardIndex, setCardIndex] = useState(0);
      const [phase, setPhase] = useState("question");
      const [answer, setAnswer] = useState("");
      const [evaluation, setEvaluation] = useState(null);
      const [stats, setStats] = useState({ easy: 0, moderate: 0, hard: 0, again: 0 });
      const [totalAnswered, setTotalAnswered] = useState(0);
      const [finished, setFinished] = useState(false);
      const [listening, setListening] = useState(false);
      const [hintsUsed, setHintsUsed] = useState(0);
      const [showHint, setShowHint] = useState(false);
      const [cardProgress, setCardProgress] = useState({});
      const [sessionStartTime] = useState(Date.now());
      const textareaRef = useRef(null);
      const recognitionRef = useRef(null);

      useEffect(() => { if (phase === "typing" && textareaRef.current) textareaRef.current.focus(); }, [phase]);

      const RC = { easy: C.green, moderate: C.amber, hard: "#f97316", again: C.red };
      const RL = { easy: "✅ Easy", moderate: "📖 Moderate", hard: "⚠️ Hard", again: "🔁 Try Again" };

      if (queue.length === 0) return (
        <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>📭</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.text }}>No cards in this deck</div>
          <button onClick={() => { if (onFinish) onFinish("back"); }} style={{ ...S.primaryBtn, width: "auto", padding: "12px 24px", marginTop: 20 }}>← Go Back</button>
        </div>
      );

      const card = queue[cardIndex];

      if (!card) return (
        <div style={{ minHeight: "100vh", background: C.bg, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: 24 }}>
          <div style={{ fontSize: 48, marginBottom: 16 }}>⚠️</div>
          <div style={{ fontSize: 18, fontWeight: 700, color: C.text }}>Something went wrong</div>
          <button onClick={() => { if (onFinish) onFinish("back"); }} style={{ ...S.primaryBtn, width: "auto", padding: "12px 24px", marginTop: 20 }}>← Go Back</button>
        </div>
      );

      const progress = (cardIndex / queue.length) * 100;

      function startVoice() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SR) { alert("Voice not supported. Use Chrome."); return; }
        const recognition = new SR();
        recognition.lang = "en-IN";
        recognition.continuous = false;
        recognition.interimResults = false;
        recognitionRef.current = recognition;
        recognition.onstart = () => setListening(true);
        recognition.onend = () => setListening(false);
        recognition.onresult = (e) => {

      async function evaluateAnswer() {
        if (!answer.trim()) return;
        setPhase("evaluating");

        // Smart type detection
        let questionType = card.type;
        if (!questionType) {
          if (card.options) questionType = "mcq";
          else {
            const words = card.answer.trim().split(/\s+/).length;
            const hasEquals = card.answer.includes("=") || card.answer.includes(";") || card.answer.includes(":");
            questionType = (words <= 6 || hasEquals) ? "oneword" : "long";
          }
        }

        try {
          const res = await fetch("https://vvrxxpaaekrxcahvoace.supabase.co/functions/v1/quick-handler", {
            method: "POST",
            headers: { "Content-Type": "application/json", "apikey": "sb_publishable_88lEXaQKkJ-A0q3DD7QHEg__g3rVdIk" },
            body: JSON.stringify({ question: card.question, answer: card.answer, studentAnswer: answer, questionType }),
          });
          const parsed = await res.json();
          let score = parsed.score !== undefined ? parseInt(parsed.score) : 0;
          if (score > 10) score = Math.round(score / 10);
          score = Math.min(10, Math.max(0, score));
          // Apply hint penalty cap
          const hintCaps = [10, 8, 6, 5, 4, 3, 2];
          const hintCap = hintCaps[Math.min(hintsUsed, hintCaps.length - 1)];
          score = Math.min(score, hintCap);
          let rating = parsed.rating;
          if (!["easy","moderate","hard","again"].includes(rating)) {
            if (score >= 8) rating = "easy";
            else if (score >= 7) rating = "moderate";
            else if (score >= 2) rating = "hard";
            else rating = "again";
          }
          setEvaluation({ ...parsed, score, rating });
          setPhase("result");
        } catch(e) {
          setEvaluation({ score: 0, rating: "again", feedback: "Could not evaluate. Try again.", missed: null });
          setPhase("result");
        }
      }

        if (!q.trim() || !a.trim()) return;
        if (qType === "mcq") {

          if (filledOpts.length < 2) return;
          if (!filledOpts.includes(a.trim())) { alert("Correct answer must be one of the options!"); return; }
          onAdd({ id: Date.now(), question: q, answer: a, options: filledOpts, type: "mcq" });

        const lines = text.trim().split("\n").filter(l => l.trim());

          const tab = line.indexOf("\t");
          if (tab > -1) return { id: i, question: line.slice(0, tab).trim(), answer: line.slice(tab + 1).trim() };
          const comma = line.indexOf(",");
          if (comma > -1) return { id: i, question: line.slice(0, comma).trim(), answer: line.slice(comma + 1).trim() };
          return null;

    function StudentApp({ user, onLogout }) {
      const [assignments, setAssignments] = useState([]);
      const [activeStudy, setActiveStudy] = useState(null);
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(true);
      const [streak, setStreak] = useState(0);
      const [longestStreak, setLongestStreak] = useState(0);
      const [studentView, setStudentView] = useState("study");
      const [showStudentExit, setShowStudentExit] = useState(false);
      const COLORS = ["#1B2B5E","#059669","#DC2626","#7C3AED","#D97706","#0891B2"];

      function showToast(msg, type = "success") { setToast({ msg, type }); setTimeout(() => setToast(null), 3000); }

      useEffect(() => { loadAssignments(); loadStreak(); }, []);

      async function loadStreak() {
        try {
          const data = await sb.req(`/streaks?student_id=eq.${user.id}`, {}, user.token);
          if (data && data.length > 0) {
            setStreak(data[0].current_streak || 0);
            setLongestStreak(data[0].longest_streak || 0);
          }
        } catch(e) {}
      }

      async function updateStreak() {
        const today = new Date().toISOString().split("T")[0];
        try {
          const data = await sb.req(`/streaks?student_id=eq.${user.id}`, {}, user.token);
          if (data && data.length > 0) {
            const s = data[0];
            const last = s.last_study_date;
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const yesterdayStr = yesterday.toISOString().split("T")[0];
            let newStreak = s.current_streak || 0;
            if (last === today) return; // already studied today
            if (last === yesterdayStr) newStreak += 1; // continued streak
            else newStreak = 1; // streak broken, restart
            const newLong
